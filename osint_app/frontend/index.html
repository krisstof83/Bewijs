<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disk Catalog Cleaner Pro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <h1>Disk Catalog Pro</h1>
        <p class="sub">Cleaner-stijl scanner voor bestanden, duplicaten en grote bestanden.</p>

        <label class="scan-button" for="folderPicker">Nieuwe scan</label>
        <input id="folderPicker" type="file" webkitdirectory directory multiple />

        <nav class="menu">
          <button data-view="all" class="active">Alle bestanden</button>
          <button data-view="large">Rode bestanden</button>
          <button data-view="duplicates">Duplicaten</button>
          <button data-view="folders">Mappen / bron</button>
          <button data-view="report">Forensisch rapport</button>
        </nav>

        <section class="stats">
          <article>
            <span>Totaal bestanden</span>
            <strong id="totalFiles">0</strong>
          </article>
          <article>
            <span>Dubbele bestanden</span>
            <strong id="totalDuplicates">0</strong>
          </article>
          <article>
            <span>Grote bestanden (&gt;500MB)</span>
            <strong id="totalLarge">0</strong>
          </article>
          <article>
            <span>Totale grootte</span>
            <strong id="totalSize">0 B</strong>
          </article>
        </section>
      </aside>

      <main class="content">
        <header>
          <h2 id="viewTitle">Alle bestanden</h2>
          <div class="actions">
            <button id="sortByName" class="secondary">Sorteer op naam</button>
            <button id="sortBySize" class="secondary">Sorteer op grootte</button>
            <button id="runAnalysis" class="secondary">ANALYSE STARTEN</button>
            <button id="clearCatalog" class="danger">Catalogus leegmaken</button>
          </div>
        </header>

        <section id="viewAll" class="panel view active"></section>
        <section id="viewLarge" class="panel view"></section>
        <section id="viewDuplicates" class="panel view"></section>
        <section id="viewFolders" class="panel view"></section>
        <section id="viewReport" class="panel view"></section>
      </main>
    </div>

    <div id="scanOverlay" class="scan-overlay hidden" aria-live="polite">
      <div class="scan-box">
        <h3>Deep Scan actief</h3>
        <p id="scanText">Scannen gestart…</p>
        <div class="progress-wrap">
          <div id="progressBar" class="progress"></div>
        </div>
        <div class="scan-stats">
          <span id="scanPercent">0%</span>
          <span id="scanCounts">0 bestanden • 0 duplicaten • 0 rood</span>
        </div>
        <div id="flyList" class="fly-list"></div>
      </div>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
