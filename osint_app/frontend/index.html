<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Forensic OSINT Dossier Platform</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Auto Forensic OSINT Dossier Platform</h1>
    </header>

    <nav class="tabs">
      <button data-tab="dashboard" class="active">Dashboard</button>
      <button data-tab="evidence">Evidence</button>
      <button data-tab="timeline">Timeline</button>
      <button data-tab="osint">OSINT Search</button>
    </nav>

    <main>
      <section id="dashboard" class="tab-content active">
        <div id="summary-cards" class="cards"></div>
      </section>

      <section id="evidence" class="tab-content">
        <ul id="evidence-list"></ul>
      </section>

      <section id="timeline" class="tab-content">
        <ul id="timeline-list"></ul>
      </section>

      <section id="osint" class="tab-content">
        <form id="osint-form">
          <input id="q" type="text" placeholder="Zoekterm" required />
          <button type="submit">Zoeken</button>
        </form>
        <ul id="osint-list"></ul>
      </section>
    </main>

    <script src="dashboard.js"></script>
  </body>
</html>
