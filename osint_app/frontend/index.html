<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINT Dossier • Forensisch Onderzoek</title>
  <style>
    :root {
      --bg: #04070f;
      --panel: #0b1224;
      --panel-2: #0e162d;
      --accent: #22d3ee;
      --accent-2: #f97316;
      --muted: #94a3b8;
      --text: #e2e8f0;
      --danger: #f87171;
      --success: #4ade80;
      --warning: #facc15;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top left, rgba(34, 211, 238, 0.1), transparent 40%),
        radial-gradient(circle at top right, rgba(249, 115, 22, 0.08), transparent 45%),
        var(--bg);
      color: var(--text);
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(4, 7, 15, 0.9);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 18px;
      margin: 0;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
    }

    header span {
      font-size: 12px;
      color: var(--muted);
    }

    main {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: calc(100vh - 60px);
    }

    aside {
      padding: 20px;
      background: var(--panel);
      border-right: 1px solid rgba(148, 163, 184, 0.2);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      background: #020617;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 10px;
      color: var(--text);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #020617;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      background: var(--panel-2);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      min-height: 72px;
      overflow-y: auto;
    }

    .content {
      padding: 20px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .panel {
      background: var(--panel);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      min-height: 200px;
    }

    .panel h2 {
      margin: 0 0 12px 0;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
    }

    .results {
      display: grid;
      gap: 12px;
    }

    .card {
      padding: 12px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      display: grid;
      gap: 6px;
    }

    .card h3 {
      margin: 0;
      font-size: 16px;
      color: var(--accent);
    }

    .card small {
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .badge.feit { background: rgba(74, 222, 128, 0.2); color: var(--success); }
    .badge.claim { background: rgba(248, 113, 113, 0.2); color: var(--danger); }
    .badge.bron { background: rgba(250, 204, 21, 0.2); color: var(--warning); }

    .timeline-item {
      padding: 10px;
      border-left: 3px solid var(--accent);
      margin-bottom: 10px;
      background: rgba(2, 6, 23, 0.5);
      border-radius: 8px;
    }

    .link {
      color: var(--accent-2);
      text-decoration: none;
    }

    .muted { color: var(--muted); }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <h1>OSINT Dossier • Forensisch Onderzoek</h1>
    <span>Juridisch neutraal • Geen privédata</span>
  </header>

  <main>
    <aside>
      <div>
        <label for="query">Algemene zoekterm</label>
        <input id="query" placeholder="Naam, e-mail, domein, onderwerp">
      </div>
      <div>
        <label for="name">Naam</label>
        <input id="name" placeholder="Volledige naam">
      </div>
      <div>
        <label for="email">E-mail</label>
        <input id="email" placeholder="example@domein.nl">
      </div>
      <div>
        <label for="phone">Telefoon</label>
        <input id="phone" placeholder="+31 6 12345678">
      </div>
      <div>
        <label for="domain">Domein</label>
        <input id="domain" placeholder="voorbeeld.nl">
      </div>
      <div>
        <label for="dateFrom">Datum vanaf</label>
        <input id="dateFrom" type="date">
      </div>
      <div>
        <label for="dateTo">Datum tot</label>
        <input id="dateTo" type="date">
      </div>
      <button id="searchBtn">🔎 Start OSINT-zoekactie</button>
      <button id="saveBtn" class="secondary" disabled>💾 Opslaan als dossier</button>
      <div class="toolbar">
        <button id="exportJson" class="secondary" disabled>⬇️ Export JSON</button>
        <button id="exportPdf" class="secondary" disabled>⬇️ Export PDF</button>
        <button id="exportReport" class="secondary" disabled>⬇️ Export Rapport</button>
      </div>
      <div class="status" id="statusLog"></div>
    </aside>

    <section class="content">
      <div class="panel">
        <h2>Resultaten</h2>
        <div class="results" id="results"></div>
      </div>
      <div class="panel">
        <h2>Tijdlijn</h2>
        <div id="timeline"></div>
      </div>
    </section>
  </main>

  <script>
    const statusLog = document.getElementById('statusLog');
    const resultsEl = document.getElementById('results');
    const timelineEl = document.getElementById('timeline');
    const saveBtn = document.getElementById('saveBtn');
    const exportJsonBtn = document.getElementById('exportJson');
    const exportPdfBtn = document.getElementById('exportPdf');
    const exportReportBtn = document.getElementById('exportReport');

    const state = {
      results: [],
      dossierId: null,
      lastPayload: null,
    };

    function log(message, tone = 'info') {
      const entry = document.createElement('div');
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${message}`;
      entry.style.color = tone === 'error' ? '#f87171' : '#e2e8f0';
      statusLog.prepend(entry);
    }

    const apiBase = new URLSearchParams(window.location.search).get('api') || 'http://localhost:8000';

    function buildPayload() {
      return {
        query: document.getElementById('query').value.trim(),
        filters: {
          name: document.getElementById('name').value.trim() || null,
          email: document.getElementById('email').value.trim() || null,
          phone: document.getElementById('phone').value.trim() || null,
          domain: document.getElementById('domain').value.trim() || null,
          date_from: document.getElementById('dateFrom').value || null,
          date_to: document.getElementById('dateTo').value || null,
        }
      };
    }

    function renderResults(items) {
      resultsEl.innerHTML = '';
      if (!items.length) {
        resultsEl.innerHTML = '<div class="muted">Geen resultaten gevonden. Controleer de zoekterm.</div>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">
            <h3>${escapeHtml(item.source)}</h3>
            <span class="badge ${item.label}">${item.label}</span>
          </div>
          <small>Datum/tijd: ${escapeHtml(item.timestamp)}</small>
          <small>Zoekterm: ${escapeHtml(item.query)}</small>
          <small>Betrouwbaarheidsscore: ${item.reliability_score.toFixed(2)}</small>
          <div>${escapeHtml(item.summary)}</div>
          <a class="link" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.url)}</a>
        `;
        resultsEl.appendChild(card);
      });
    }

    function renderTimeline(items) {
      timelineEl.innerHTML = '';
      if (!items.length) {
        timelineEl.innerHTML = '<div class="muted">Geen tijdlijn beschikbaar.</div>';
        return;
      }

      const grouped = items.reduce((acc, item) => {
        const date = item.timestamp.slice(0, 10);
        acc[date] = acc[date] || [];
        acc[date].push(item);
        return acc;
      }, {});

      Object.keys(grouped).sort().forEach(date => {
        const wrapper = document.createElement('div');
        wrapper.className = 'timeline-item';
        wrapper.innerHTML = `<strong>${date}</strong><div class="muted">${grouped[date].length} items</div>`;
        grouped[date].forEach(item => {
          const p = document.createElement('div');
          p.textContent = `• ${item.source} — ${item.summary}`;
          wrapper.appendChild(p);
        });
        timelineEl.appendChild(wrapper);
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function runSearch() {
      const payload = buildPayload();
      state.lastPayload = payload;
      state.dossierId = null;
      saveBtn.disabled = true;
      exportJsonBtn.disabled = true;
      exportPdfBtn.disabled = true;
      exportReportBtn.disabled = true;

      log('Zoekactie gestart: bronnen worden bevraagd...');
      try {
        const response = await fetch(`${apiBase}/search`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.detail || 'Onbekende fout');
        }
        const data = await response.json();
        state.results = data;
        renderResults(data);
        renderTimeline(data);
        saveBtn.disabled = !data.length;
        log(`Zoekactie afgerond. ${data.length} resultaten verwerkt.`);
      } catch (error) {
        log(`Fout tijdens zoeken: ${error.message}`, 'error');
        renderResults([]);
        renderTimeline([]);
      }
    }

    async function saveDossier() {
      if (!state.lastPayload) {
        log('Geen zoekactie gevonden om op te slaan.', 'error');
        return;
      }
      log('Dossier wordt opgeslagen...');
      try {
        const response = await fetch(`${apiBase}/dossiers`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state.lastPayload),
        });
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.detail || 'Opslaan mislukt');
        }
        const dossier = await response.json();
        state.dossierId = dossier.dossier_id;
        exportJsonBtn.disabled = false;
        exportPdfBtn.disabled = false;
        exportReportBtn.disabled = false;
        log(`Dossier opgeslagen met ID ${state.dossierId}.`);
      } catch (error) {
        log(`Fout tijdens opslaan: ${error.message}`, 'error');
      }
    }

    function exportDossier(format) {
      if (!state.dossierId) {
        log('Geen dossier-ID beschikbaar voor export.', 'error');
        return;
      }
      const url = `${apiBase}/dossiers/${state.dossierId}/export/${format}`;
      window.open(url, '_blank');
      log(`Export gestart: ${format.toUpperCase()}.`);
    }

    document.getElementById('searchBtn').addEventListener('click', runSearch);
    saveBtn.addEventListener('click', saveDossier);
    exportJsonBtn.addEventListener('click', () => exportDossier('json'));
    exportPdfBtn.addEventListener('click', () => exportDossier('pdf'));
    exportReportBtn.addEventListener('click', () => exportDossier('report'));

    log('Stand-by. Vul filters in en start de zoekactie.');
  </script>
</body>
</html>
